name: Docs + PDF

# Proof-of-concept end-to-end pipeline for a zensical site:
#   build -> generate PDFs (headless Chrome) -> publish to Pages
#   Two renders of the same site: the whole site as ONE manual
#   (make_pdfs_single.py) and one standalone volume document per section
#   (make_pdfs_volumes.py). All PDFs are uploaded as build artifacts, attached
#   to a "latest" Release, and exposed as Download links on the published site.
#
# NOTE: actions are tag-pinned for PoC readability. For a production repo,
# SHA-pin every `uses:` (per the shared-workflows standard).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # create the "latest" Release + upload the PDF asset
  pages: write # deploy to GitHub Pages
  id-token: write # OIDC token required by deploy-pages

concurrency:
  group: docs-pdf-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # Playwright's bundled Chromium (the PDF scripts use it when
          # PDF_CHROME_CHANNEL=chromium; locally they default to system Chrome).
          python -m playwright install --with-deps chromium

      - name: Build site (zensical)
        run: zensical build

      # Single-document render (make_pdfs_single.py): every page concatenated into
      # one HTML doc, one Chrome print pass -> exact TOC page numbers + working
      # cross-page links, compressed with pikepdf (keeps the links; Ghostscript
      # would strip them). Peaks at ~3.7 GB RAM at full scale — fine on the 7 GB
      # runner. The per-page make_pdfs.py remains as the reference implementation.
      - name: Generate the document (title + TOC + figures + numbered body)
        env:
          PDF_CHROME_CHANNEL: chromium
          PDF_SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: PDF_DATE="$(date -u '+%-d %B %Y')" python make_pdfs_single.py

      # Per-volume render (make_pdfs_volumes.py): the same single-render recipe
      # scoped to one section per document -> vol1.pdf .. volN.pdf. Each volume
      # is standalone (own title page / TOC / figures / outline, numbering
      # restarts at 1); links that leave a volume are retargeted at the
      # published site. Additive next to the single manual, not a replacement.
      - name: Generate the volume documents (one standalone PDF per section)
        env:
          PDF_CHROME_CHANNEL: chromium
          PDF_SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: PDF_DATE="$(date -u '+%-d %B %Y')" python make_pdfs_volumes.py

      - name: Add manual.pdf + volume PDFs into the site (for the Download links)
        run: |
          cp pdfs/zensical-manual.pdf site/manual.pdf
          mkdir -p site/volumes
          cp pdfs/vol*.pdf site/volumes/

      - name: Upload PDF build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: zensical-manual-pdf
          path: pdfs/zensical-manual.pdf
          if-no-files-found: error

      - name: Upload volume PDFs build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: zensical-volume-pdfs
          path: pdfs/vol*.pdf
          if-no-files-found: error

      - name: Publish/refresh the "latest" Release with the PDFs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --cleanup-tag --yes 2>/dev/null || true
          gh release create latest pdfs/zensical-manual.pdf pdfs/vol*.pdf \
            --title "Latest docs PDFs" \
            --notes "Auto-generated from ${{ github.sha }} on $(date -u +%Y-%m-%dT%H:%MZ). zensical-manual.pdf is the whole site as one document; vol1..volN are one standalone document per section."

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
